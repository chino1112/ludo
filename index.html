<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ludo con amigos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--card:#2a2350cc;--line:#4b4180;--tx:#fff6e6;--mut:#b4abd6;--ac:#ff8a5c}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--tx);font:500 16px/1.4 Fredoka,"Trebuchet MS",sans-serif;display:flex;justify-content:center;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));min-height:100vh;
background:radial-gradient(circle at 20% 0%,#4a2f8a 0,transparent 45%),radial-gradient(circle at 90% 100%,#1f5a8a 0,transparent 40%),#1a1436}
main{width:100%;max-width:1020px}
#hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none;background:linear-gradient(145deg,#ff8a5c,#e8403f);box-shadow:0 4px 0 #8e2a1a}
h1{font:700 30px/1 Fredoka,sans-serif;margin:0;text-shadow:0 3px 0 #0006}
.sub{color:var(--mut);margin:3px 0 0;font-size:14px}
.card,.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;backdrop-filter:blur(6px);box-shadow:0 10px 30px #0005}
.card{padding:18px;max-width:420px}
label{display:block;color:var(--mut);margin:12px 0 4px;font-size:14px}
input{width:100%;padding:11px;border-radius:10px;border:2px solid var(--line);background:#150f2c;color:var(--tx);font:inherit;font-size:18px}
input:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font:700 17px Fredoka,sans-serif;background:var(--ac);color:#2b1204;box-shadow:0 4px 0 #b4552e;transition:transform .1s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #b4552e}
button:disabled{opacity:.4;cursor:not-allowed}
button.alt{background:#3b3270;color:var(--tx);box-shadow:0 4px 0 #231c4a}
button.alt:active:not(:disabled){box-shadow:0 1px 0 #231c4a}
.row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}

/* iconos */
#tools{display:flex;gap:8px;flex:none}
.ib{width:46px;height:46px;padding:0;display:grid;place-items:center;border-radius:14px}
.ib.sm{width:36px;height:36px;border-radius:10px}
.ib svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ib.live{background:#2fbf71;color:#04230f;box-shadow:0 4px 0 #1c7a45;animation:live 1.6s infinite}
.ib.bad{background:#e8403f;color:#fff;box-shadow:0 4px 0 #8f2323}
@keyframes live{50%{filter:brightness(1.2)}}

#game{display:grid;grid-template-columns:minmax(0,640px) 1fr;gap:18px;align-items:start}
#bw{position:relative}
canvas{width:100%;height:auto;border-radius:20px;border:4px solid #4b4180;box-shadow:0 14px 40px #000a;touch-action:manipulation;display:block}
.panel{padding:16px;display:grid;gap:12px}
.room{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:14px;background:#150f2c99}
.room small{flex:none}.room b{flex:1;font:700 26px Fredoka,sans-serif;letter-spacing:5px;color:#ffd36b}

/* jugadores (perfil) */
#seats{display:grid;gap:8px}
.seat{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:2px solid transparent;background:#150f2c99;transition:.25s}
.seat.on{border-color:var(--c);box-shadow:0 0 18px -2px var(--c);transform:scale(1.02)}
.seat.off{opacity:.7}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font:700 18px Fredoka,sans-serif;border:3px solid #fff3;flex:none;text-shadow:0 1px 2px #0006}
.seat.talk .av{box-shadow:0 0 0 3px #fff9,0 0 0 7px var(--c);animation:talk .5s infinite alternate}
@keyframes talk{to{transform:scale(1.1)}}
.nm{display:grid;line-height:1.15;min-width:0;flex:1}
.nm b,.nm small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{font-size:12px}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;border-radius:50%;background:#ffffff22;border:1px solid #fff4}
.pips i.d{background:#ffd36b;border-color:#ffd36b}
.act{width:38px;height:38px;padding:0;font-size:20px;border-radius:11px;flex:none;box-shadow:0 3px 0 #231c4a;line-height:1}
.kick{padding:5px 10px;font-size:13px;border-radius:9px;background:#5b2a3a;color:#ffb3b3;box-shadow:0 3px 0 #3a1624;flex:none}
.seat.off .kick{background:#e8403f;color:#fff;box-shadow:0 3px 0 #8f2323}

#st{font-weight:700;font-size:20px;min-height:28px;text-align:center}
#tbox{display:flex;align-items:center;gap:8px;height:16px}
#tb{flex:1;height:10px;border-radius:6px;background:#150f2c;overflow:hidden;border:1px solid var(--line)}
#tbar{height:100%;width:100%;border-radius:6px;background:var(--ac)}
#tbar.hot{background:#ff4040!important}
#tnum{font:700 16px Fredoka,sans-serif;width:22px;text-align:right}

/* dado: vive dentro del tablero, en la casa de quien juega */
#dice{position:absolute;left:50%;top:50%;translate:-50% -50%;width:13%;aspect-ratio:1;z-index:5;container-type:inline-size;transition:left .45s ease,top .45s ease;
border-radius:22%;background:linear-gradient(145deg,#fff,#d9d2ea);border:4px solid #888;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 #0004,0 10px 18px #0006;user-select:none;-webkit-tap-highlight-color:transparent}
#dice.ready{animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 6px 0 #0004,0 0 28px 8px #ffd36b}}
#pips{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:74%;height:74%}
#pips i{width:68%;aspect-ratio:1;border-radius:50%;margin:auto;background:transparent}
#pips i.on{background:radial-gradient(circle at 35% 30%,#555,#111)}
#dem{font-size:50cqw;line-height:1}
#roll{display:none!important}
#msg{color:var(--mut);min-height:22px;text-align:center}
small{color:var(--mut)}
#hint{text-align:center;font-size:13px}

@media(max-width:840px){
 body{padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
 #hdr{margin-bottom:8px}h1{font-size:22px}.logo{width:38px;height:38px;font-size:22px}.sub{display:none}
 .ib{width:40px;height:40px}.ib svg{width:20px;height:20px}
 #game{display:flex;flex-direction:column;gap:8px}
 .panel{display:contents}
 #st{order:1;font-size:17px;min-height:0}#tbox{order:2}#start,#again{order:2}#bw{order:3}#msg{order:4;min-height:0}#seats{order:5;gap:6px}.room{order:6}
 .seat{padding:6px 8px}.av{width:32px;height:32px;font-size:16px}.act{width:36px;height:36px}
 canvas{border-width:3px;border-radius:14px}
 #hint{display:none}
}

/* hoja inferior (regalos / emojis / reglas) */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.bd{position:absolute;inset:0;background:#0009}
.sh{position:relative;width:100%;max-width:520px;max-height:85vh;overflow:auto;background:#241d4a;border:2px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:3px;background:#ffffff33;margin:0 auto 10px}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.shh b{font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}.chips button{padding:6px 10px;font-size:14px}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gf{padding:8px 2px;display:grid;justify-items:center;line-height:1}.gf span{font-size:32px}.gf small{font-size:12px;margin-top:5px;color:inherit}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.em{padding:6px;font-size:28px;line-height:1.2}
.rules{margin:0;padding-left:20px;display:grid;gap:8px}
.dotc{display:inline-block;vertical-align:middle;width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid #0005}

/* avisos */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:80;width:min(92vw,420px);pointer-events:none}
.toast{background:#150f2cee;border:2px solid var(--line);padding:9px 14px;border-radius:14px;text-align:center;box-shadow:0 8px 24px #0008;animation:ti .25s,to .4s 2.8s forwards}
@keyframes ti{from{opacity:0;transform:translateY(-10px)}}
@keyframes to{to{opacity:0}}
#ov{position:fixed;inset:0;z-index:90;background:#000c;display:grid;place-items:center;padding:20px}
#ov .card{text-align:center;padding:24px}
#ov p{font-size:18px;margin:0 0 16px}

@keyframes shake{0%,100%{transform:none}15%{transform:translate(-9px,5px) rotate(-.8deg)}30%{transform:translate(8px,-6px) rotate(.8deg)}45%{transform:translate(-7px,-4px)}60%{transform:translate(6px,5px)}80%{transform:translate(-3px,2px)}}
canvas.shake{animation:shake .6s}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<main>
<header id="hdr">
  <div class="brand"><div class="logo">🎲</div><div><h1>Ludo con amigos</h1><p class="sub">De 2 a 4 jugadores, con voz en vivo.</p></div></div>
  <div id="tools" hidden>
    <button id="mic" class="ib alt" type="button"></button>
    <button id="snd" class="ib" type="button"></button>
    <button id="mus" class="ib alt" type="button"></button>
    <button id="help" class="ib alt" type="button"></button>
  </div>
</header>

<section id="menu" class="card">
  <label for="name">Tu nombre</label>
  <input id="name" maxlength="12" placeholder="Ej: Carlos" autocomplete="nickname">
  <div class="row"><button id="create">Crear sala</button></div>
  <label for="join">o entra con el código de tu amigo</label>
  <input id="join" maxlength="5" placeholder="CÓDIGO" style="text-transform:uppercase">
  <div class="row"><button id="joinBtn" class="alt">Unirme</button></div>
  <p id="err" style="color:#ff9a8a;min-height:20px;margin:10px 0 0"></p>
</section>

<section id="game" hidden>
  <div id="bw">
    <canvas id="cv" width="750" height="750" aria-label="Tablero de Ludo"></canvas>
    <div id="dice" role="button" aria-label="Tirar dado"><div id="pips"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div id="dem">🎲</div></div>
  </div>
  <div class="panel">
    <div class="room"><small>Sala</small><b id="code"></b><button class="ib sm alt" id="copy" type="button" title="Copiar enlace para invitar" aria-label="Copiar enlace para invitar"></button></div>
    <div id="seats"></div>
    <div id="st"></div>
    <div id="tbox"><div id="tb"><div id="tbar"></div></div><span id="tnum"></span></div>
    <div id="msg"></div>
    <button id="roll" disabled>Tirar dado</button>
    <button id="start" hidden>Empezar partida</button>
    <button id="again" class="alt" hidden>Jugar otra vez</button>
    <small id="hint">Toca 😜 en tu perfil para mandar emojis y 🎁 en el de tus amigos para regalarles algo. Para hablar activa el micrófono.</small>
  </div>
</section>
</main>

<div id="sheet" hidden>
  <div class="bd" id="bd"></div>
  <div class="sh" role="dialog" aria-modal="true" aria-labelledby="sht">
    <div class="grab"></div>
    <div class="shh"><b id="sht"></b><button class="ib sm alt" id="shx" type="button" aria-label="Cerrar">✕</button></div>
    <div id="shc"></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="ov" hidden><div class="card"><p id="ovt"></p><button id="ovb">Volver al inicio</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL=['#e8403f','#33b35e','#f5b81c','#3a7bf0'],SHD=['#a02424','#1d7038','#b98400','#1d4fb0'],NAMES=['Rojo','Verde','Amarillo','Azul'];
const ROLL_MS=15000,MOVE_MS=15000;   // tiempo para tirar el dado / mover la ficha
const L=(r,c,dr,dc,n)=>Array.from({length:n},(_,k)=>[r+dr*k,c+dc*k]);
const T=[...L(6,1,0,1,5),...L(5,6,-1,0,6),[0,7],[0,8],...L(1,8,1,0,5),...L(6,9,0,1,6),[7,14],[8,14],
 ...L(8,13,0,-1,5),...L(9,8,1,0,6),[14,7],[14,6],...L(13,6,-1,0,5),...L(8,5,0,-1,6),[7,0],[6,0]];
const H=[L(7,1,0,1,5),L(1,7,1,0,5),L(7,13,0,-1,5),L(13,7,-1,0,5)];
const ST=[0,13,26,39],SAFE=new Set([0,8,13,21,26,34,39,47]);
const BO=[[0,0],[0,9],[9,9],[9,0]],BS=[[1,1],[1,4],[4,1],[4,4]],DIR=[[-1,0],[0,-1],[1,0],[0,1]];
const fresh=()=>({seats:[null,null,null,null],auto:[0,0,0,0],off:[0,0,0,0],miss:[0,0,0,0],pids:{},pcs:[0,1,2,3].map(()=>[-1,-1,-1,-1]),turn:0,dice:0,roll:0,phase:'lobby',sixes:0,msg:'',win:-1,tl:0,td:0,tk:0});
let S=fresh(),me=-1,isHost=false,peer,conn,conns={},code='',myName='',got=false,dead=false;
const cv=$('cv'),g=cv.getContext('2d'),SZ=50,DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=cv.height=750*DPR;

/* ---------- Iconos SVG ---------- */
const IP={mic:'<path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3M9 21h6"/>',
 spk:'<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/>',
 mus:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'};
const icon=(n,slash)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IP[n]}${slash?'<path d="M4 4l16 16"/>':''}</svg>`;
function lab(el,t){el.title=t;el.setAttribute('aria-label',t)}

/* ---------- Audio (sintetizado, sin archivos) ---------- */
let AC,MG,MUS,REV,snd=true,musOn=false;
function initAudio(){
  if(AC){AC.state=='suspended'&&AC.resume();return}
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const cmp=AC.createDynamicsCompressor();cmp.threshold.value=-18;cmp.ratio.value=5;
  MG=AC.createGain();MG.gain.value=snd?.9:0;MG.connect(cmp);cmp.connect(AC.destination);
  MUS=AC.createGain();MUS.gain.value=.13;MUS.connect(MG);
  const n=Math.floor(AC.sampleRate*1.3),ir=AC.createBuffer(2,n,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}
  REV=AC.createConvolver();REV.buffer=ir;const rg=AC.createGain();rg.gain.value=.2;REV.connect(rg);rg.connect(MG);
}
addEventListener('pointerdown',()=>{initAudio();AUD.forEach(a=>a.paused&&a.play().catch(()=>{}))});
function tone(f,d=.1,type='sine',v=.15,to=0,delay=0,bus){
  if(!snd||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),a=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(v,t+.008);a.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(a);a.connect(bus||MG);a.connect(REV);o.start(t);o.stop(t+d+.05)}
function noise(d=.3,v=.2,f=800,to=0,type='lowpass',delay=0){
  if(!snd||!AC)return;const t=AC.currentTime+delay,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const sr=AC.createBufferSource();sr.buffer=b;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);
  const gn=AC.createGain();gn.gain.value=v;sr.connect(fl);fl.connect(gn);gn.connect(MG);sr.start(t)}
const SFX={
  click:()=>tone(900,.04,'triangle',.06),
  rattle:()=>{noise(.03,.16,1800+Math.random()*1800,0,'bandpass');tone(300+Math.random()*200,.03,'square',.03)},
  land:()=>{tone(150,.2,'sine',.45,55);noise(.07,.3,1400)},
  hop:()=>{const f=760+Math.random()*120;tone(f,.07,'triangle',.2,f*.7);tone(f*1.5,.04,'sine',.06)},
  /* comida: golpe + silbido + trombón triste */
  cap:()=>{noise(.5,.35,300,2500,'bandpass');tone(500,.45,'sawtooth',.14,60);tone(90,.4,'sine',.4,40,.05);tone(1400,.25,'square',.06,300,.02);
    [392,349,311,262].forEach((f,i)=>tone(f,.2,'triangle',.13,f*.9,.45+i*.2))},
  turn:()=>{tone(784,.18,'sine',.16);tone(1175,.3,'sine',.16,0,.11)},
  warn:()=>tone(1000,.07,'square',.07),
  join:()=>{tone(523,.12,'triangle',.14);tone(784,.2,'triangle',.14,0,.09)},
  leave:()=>{tone(784,.12,'triangle',.12);tone(523,.2,'triangle',.12,0,.09)},
  fin:()=>[523,659,784,1047,1319].forEach((f,i)=>{tone(f,.28,'triangle',.18,0,i*.07);tone(f*2,.12,'sine',.05,0,i*.07)}),
  throw:()=>{noise(.35,.14,500,3000,'bandpass');tone(300,.35,'sine',.08,900)},
  pop:()=>{noise(.35,.26,4000,500);tone(1200+Math.random()*800,.22,'sine',.07,300);tone(200,.2,'sine',.25,60)},
  /* victoria: fanfarria + aplausos */
  win:()=>{[[523,659,784],[587,740,880],[659,784,988],[784,988,1175,1568]].forEach((ch,i)=>ch.forEach(f=>tone(f,.5,'triangle',.11,0,i*.22)));
    [1047,1319,1568,2093].forEach((f,i)=>tone(f,.3,'square',.05,0,1+i*.12));
    for(let i=0;i<14;i++)noise(.06,.2,2200,0,'bandpass',1+i*.09+Math.random()*.05)}};
const IMP={splash:()=>{noise(.5,.35,5000,800)},boom:()=>{noise(.9,.55,600,80);tone(120,.7,'sawtooth',.3,30);tone(60,.8,'sine',.5,30)},
 splat:()=>{noise(.18,.4,900,300);tone(220,.18,'sine',.3,60)},
 frost:()=>{[1400,1900,2600].forEach((f,i)=>tone(f,.3,'triangle',.08,f*1.4,i*.05));noise(.25,.1,6000)},
 fire:()=>{noise(.8,.3,1800,400)},love:()=>[784,988,1319,1568].forEach((f,i)=>tone(f,.25,'triangle',.14,0,i*.08))};

/* ---------- Sonidos de emojis: VOCES ÉPICAS DE ANIME (gritos, risas, llantos) ---------- */
const N=(f,d,t,v,to,dl)=>tone(f,d,t||'sine',v||.14,to||0,dl||0);

/* Tus propios audios: pon aquí la ruta o enlace de un .mp3/.ogg para cualquier emoji.
   Si el archivo falla o está vacío, suena la voz sintetizada de abajo.
   Ejemplo:  '😱':'sonidos/grito.mp3',  '🔥':'https://tusitio.com/poder.mp3'  */
const AUDIOS={};

/* Sintetizador de VOZ: onda con formantes de vocal (a,o,u,e,i), vibrato y distorsión (grit) para gritos rotos */
const FM={a:[800,1150,2900],o:[450,800,2830],u:[325,700,2530],e:[400,2000,2550],i:[270,2300,3010]};
const CURVES={};
function curva(k){if(CURVES[k])return CURVES[k];const c=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*(1+k*9))}return CURVES[k]=c}
function voz(v,f0,f1,d,dl=0,vol=.3,vib=0,grit=0){
  if(!snd||!AC)return;

function join(c){

    conn=peer.connect('ludo-'+code,{reliable:true});
    conn.on('open',()=>{conn.send({t:'hi',name:myName,pid:id});hb=setInterval(()=>conn.open&&conn.send({t:'p'}),2500)});

function update(dt){

      if(S.pcs[c][i]>=0){SFX.hop();if(!v.q.length&&v.lp==56){SFX.fin();burst(tx,ty,'#ffd36b',26)}}

    g.globalAlpha=u>.7?(1-u)/.3:1;g.font=(66*sc)+'px serif';g.fillText(f.e,f.x+Math.sin(f.a*8)*6,f.y-f.a*45)});g.globalAlpha=1;
  PT.forEach(p=>{const u=p.a/p.l,sc=p.a<.15?p.a/.15*1.4:1.4-.4*Math.min(1,(p.a-.15)/.2);

/* pantalla de victoria: rayos giratorios, trofeo saltarín y fuegos artificiales */
function drawWin(t){
  const w=Math.min(1,WT/.7),e=1-Math.pow(1-w,3),pop=w<1?1+Math.sin(w*Math.PI)*.2:1,col=COL[S.win];

  for(let k=0;k<12;k++){g.rotate(Math.PI/6);g.beginPath();g.moveTo(0,0);g.arc(0,0,560,-.13,.13);g.closePath();g.fill()}
  g.restore();

  g.shadowColor=col;g.shadowBlur=40;g.fillStyle='#1a1436ee';g.beginPath();g.roundRect(-320,-115,640,230,34);g.fill();g.shadowBlur=0;g.lineWidth=6;g.strokeStyle=col;g.stroke();
  g.textAlign='center';g.textBaseline='middle';g.font='90px serif';g.fillText('🏆',0,-58-Math.abs(Math.sin(t*4))*16);

/* ---------- Dibujo ---------- */
const bc=document.createElement('canvas');bc.width=bc.height=750*DPR;let bkey='';
function board(){
  const k=JSON.stringify([S.seats,S.off,S.auto]);if(k==bkey)return;bkey=k;
  const x=bc.getContext('2d'),s=SZ;x.setTransform(DPR,0,0,DPR,0,0);x.fillStyle='#2b2548';x.fillRect(0,0,750,750);
  x.textAlign='center';x.textBaseline='middle';
  for(let c=0;c<4;c++){const[o,q]=BO[c],on=!!S.seats[c],gr=x.createLinearGradient(q*s,o*s,(q+6)*s,(o+6)*s);
    gr.addColorStop(0,on?COL[c]:'#3a3463');gr.addColorStop(1,on?SHD[c]:'#2b2548');x.fillStyle=gr;x.fillRect(q*s,o*s,6*s,6*s);
    if(on){x.fillStyle='#fff8ec';x.beginPath();x.roundRect((q+.7)*s,(o+.7)*s,4.6*s,4.6*s,24);x.fill();
      BS.forEach(([r,kk])=>{x.beginPath();x.arc((q+kk+.5)*s,(o+r+.5)*s,s*.44,0,7);x.fillStyle=COL[c]+'30';x.fill();x.lineWidth=3;x.strokeStyle=COL[c]+'90';x.stroke()});
      x.fillStyle='#fff';x.shadowColor='#0009';x.shadowBlur=4;x.font='700 18px Fredoka,Trebuchet MS,sans-serif';x.fillText(S.seats[c],(q+3)*s,(o+.38)*s,260);
      if(S.off[c]||S.auto[c]){x.font='500 13px Fredoka,sans-serif';x.fillText(S.off[c]?'🔌 sin conexión':'🤖 automático',(q+3)*s,(o+5.62)*s,260)}
      x.shadowBlur=0;
    }else{x.fillStyle='#6a6196';x.font='500 16px Fredoka,sans-serif';x.fillText('libre',(q+3)*s,(o+3)*s)}}
  const cell=(r,kk,f)=>{x.beginPath();x.roundRect(kk*s+1.5,r*s+1.5,s-3,s-3,8);x.fillStyle=f;x.fill()};
  T.forEach(([r,kk],idx)=>{cell(r,kk,'#fff8ec');if(SAFE.has(idx)&&!ST.includes(idx)){x.fillStyle='#cdbb90';x.font='26px sans-serif';x.fillText('★',(kk+.5)*s,(r+.55)*s)}});
  for(let c=0;c<4;c++)if(S.seats[c]){const[sr,sk]=T[ST[c]];cell(sr,sk,COL[c]);x.fillStyle='#fffb';x.font='26px sans-serif';x.fillText('★',(sk+.5)*s,(sr+.55)*s);
    H[c].forEach(([r,kk])=>cell(r,kk,COL[c]+'d8'))}
  [[[6,6],[6,9]],[[6,6],[9,6]],[[9,6],[9,9]],[[6,9],[9,9]]].forEach(([a,b],c)=>{
    x.beginPath();x.moveTo(a[0]*s,a[1]*s);x.lineTo(b[0]*s,b[1]*s);x.lineTo(7.5*s,7.5*s);x.closePath();x.fillStyle=S.seats[c]?COL[c]:'#3a3463';x.fill();x.strokeStyle='#fff8ec';x.lineWidth=2;x.stroke()});
  x.beginPath();x.arc(7.5*s,7.5*s,s*.5,0,7);x.fillStyle='#fff8ec';x.fill();x.fillStyle='#e0a400';x.font='34px sans-serif';x.fillText('★',7.5*s,7.55*s);
}
function pawn(px,py,r,col,lift){
  g.fillStyle='#0005';g.beginPath();g.ellipse(px,py+r*.8,r*.85,r*.3,0,0,7);g.fill();py-=lift;
  g.beginPath();g.moveTo(px-r*.85,py+r*.8);g.quadraticCurveTo(px-r*.3,py+r*.15,px-r*.2,py-r*.15);g.lineTo(px+r*.2,py-r*.15);g.quadraticCurveTo(px+r*.3,py+r*.15,px+r*.85,py+r*.8);g.closePath();
  g.fillStyle=col;g.fill();g.lineWidth=2;g.strokeStyle='#000a';g.stroke();
  const gr=g.createRadialGradient(px-r*.2,py-r*.55,r*.05,px,py-r*.35,r*.6);gr.addColorStop(0,'#fff');gr.addColorStop(.35,col);gr.addColorStop(1,col);
  g.beginPath();g.arc(px,py-r*.35,r*.52,0,7);g.fillStyle=gr;g.fill();g.stroke();
}
let hits=[];const canPick=()=>S.phase=='move'&&S.turn==me&&!rolling;
function frame(ms){
  const t=ms/1000,dt=Math.min(.05,t-(frame.t||t));frame.t=t;
  if(!$('game').hidden){
    g.setTransform(DPR,0,0,DPR,0,0);
    update(dt);board();g.drawImage(bc,0,0,750,750);
    if(S.phase!='lobby'&&S.phase!='over'){const[o,q]=BO[S.turn];g.save();g.shadowColor=COL[S.turn];g.shadowBlur=24;g.lineWidth=7;g.strokeStyle='#fff';
      g.globalAlpha=.45+.45*Math.sin(t*4);g.strokeRect(q*SZ+4,o*SZ+4,6*SZ-8,6*SZ-8);g.restore()}
    drawStains(t);
    const list=[],grp={};hits=[];
    for(let c=0;c<4;c++)if(S.seats[c])for(let i=0;i<4;i++){const v=V[c][i],rest=!v.q.length&&v.wait<=0,key=rest?Math.round(v.x*2)+','+Math.round(v.y*2):'m'+c+i;(grp[key]=grp[key]||[]).push({c,i,v})}
    Object.values(grp).forEach(a=>a.forEach((it,n)=>{it.ox=(n-(a.length-1)/2)*.28;it.r=(a.length>1?.3:.38)*SZ;list.push(it)}));
    list.sort((a,b)=>a.v.y-b.v.y);
    const mv=canPick()?movable(me):[];
    list.forEach(({c,i,v,ox,r})=>{
      const can=c==me&&mv.includes(i),px=(v.x+ox)*SZ+(v.wait>0&&v.big?Math.sin(t*70)*3:0),py=v.y*SZ;let lift=v.hop*SZ;
      if(S.phase=='over'&&c==S.win)lift+=Math.abs(Math.sin(t*5+i*1.3))*SZ*.5;
      if(can){lift+=Math.abs(Math.sin(t*6+i))*SZ*.22;g.beginPath();g.ellipse(px,py+r*.8,r*1.1+Math.sin(t*6)*3,r*.45,0,0,7);g.lineWidth=4;g.strokeStyle='#fff';g.stroke();hits.push([px,py-r*.3,r*1.15,i])}
      pawn(px,py,r,COL[c],lift)});
    if(S.phase=='over')drawWin(t);
    P.forEach(p=>{g.globalAlpha=Math.max(0,Math.min(1,p.l));g.fillStyle=p.c;g.beginPath();g.arc(p.x*SZ,p.y*SZ,p.s*SZ,0,7);g.fill()});g.globalAlpha=1;
    drawFx();
    timerUI();voiceUI(t);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Hoja inferior: regalos, emojis y reglas ---------- */
let sheetKind='';
function sheetHtml(){
  if(sheetKind=='rules')return `<ol class="rules">
   <li>Toca el <b>dado</b> (aparece en tu casa) para tirarlo. Saca un <b>6</b> para sacar una ficha.</li>
   <li>Un <b>6</b>, comerte una ficha o llegar a la meta te da <b>otro turno</b>.</li>
   <li>Tres 6 seguidos: pierdes el turno.</li>
   <li>Las casillas con <b>★</b> son seguras: ahí no te pueden comer.</li>
   <li>Tienes <b>15 segundos</b> para tirar el dado y <b>15 segundos</b> para mover la ficha. Si se acaba el tiempo, el juego juega por ti.</li>
   <li>Tres tiempos agotados seguidos activan el modo automático 🤖. Si vuelves a jugar, se desactiva.</li>
   <li>Toca 😜 en tu perfil para emojis con sonido y 🎁 en el perfil de un amigo para lanzarle regalos.</li>
   <li>Gana quien lleve sus 4 fichas a la meta.</li></ol><p style="margin:12px 0 0;font-size:12px;color:var(--mut)">Sonidos de emojis: grabaciones de la Biblioteca de sonidos de Google, licencia CC-BY 4.0.</p>`;
  if(sheetKind=='emos')return `<div class="emos">${EMOS.map(e=>`<button class="alt em" data-k="${e}">${e}</button>`).join('')}</div>`;
  const opp=[0,1,2,3].filter(c=>S.seats[c]&&c!=me);
  if(!opp.length)return '<small>Cuando entre alguien más podrás mandarle regalos.</small>';
  return `<small>Enviar a</small><div class="chips">${opp.map(c=>`<button class="${c==tgt?'':'alt'}" data-t="${c}"><span class="dotc" style="--c:${COL[c]}"></span> ${esc(S.seats[c])}</button>`).join('')}</div>
   <div class="gifts">${Object.entries(GIFTS).map(([k,G])=>`<button class="alt gf" data-k="${k}"><span>${G.e}</span><small>${G.n}</small></button>`).join('')}</div>`;
}
function drawSheet(){const h=sheetHtml();if($('shc').dataset.h!==h){$('shc').innerHTML=h;$('shc').dataset.h=h}}
function openSheet(k){sheetKind=k;$('sht').textContent=k=='gifts'?'🎁 Paquete de regalos':k=='emos'?'😜 Paquete de emojis':'Cómo se juega';$('shc').dataset.h='';$('sheet').hidden=false;drawSheet()}
function closeSheet(){$('sheet').hidden=true}
function sendOne(k,to){if(Date.now()-lastSend<1000){toast('Espera un segundo ⏳');return}lastSend=Date.now();sendFx(k,to);closeSheet()}
$('shc').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t!==undefined){tgt=+b.dataset.t;drawSheet();return}
  if(b.dataset.k===undefined)return;
  if(sheetKind=='gifts'){if(tgt>=0)sendOne(b.dataset.k,tgt)}else if(sheetKind=='emos')sendOne(b.dataset.k)};
$('help').onclick=()=>openSheet('rules');
$('shx').onclick=closeSheet;$('bd').onclick=closeSheet;
addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});

/* ---------- Interfaz ---------- */
let seatsHtml='';
function render(){
  if($('game').hidden)return;diff();notify();
  const lobby=S.phase=='lobby',n=S.seats.filter(Boolean).length;
  const html=S.seats.map((nm,c)=>{if(!nm)return '';
    const done=S.pcs[c].filter(x=>x==56).length,turn=!lobby&&S.turn==c&&S.phase!='over';
    const sub=NAMES[c]+(c==0?' · 👑':'')+(c==me?' · tú':'')+(S.off[c]?' · 🔌 sin conexión':S.auto[c]?' · 🤖 automático':'');
    const pips=lobby?'':'<span class="pips" title="Fichas en la meta">'+[0,1,2,3].map(k=>`<i class="${k<done?'d':''}"></i>`).join('')+'</span>';
    const act=c==me?'<button class="act alt" type="button" data-e="1" aria-label="Enviar emoji">😜</button>':`<button class="act alt" type="button" data-g="${c}" aria-label="Regalar a ${esc(nm)}">🎁</button>`;
    const kb=isHost&&c!=me?`<button class="kick" type="button" data-k="${c}" aria-label="Expulsar a ${esc(nm)}">${S.off[c]?'Expulsar':'✕'}</button>`:'';
    return `<div class="seat ${turn?'on':''} ${S.off[c]?'off':''}" data-s="${c}" style="--c:${COL[c]}"><span class="av">${esc((nm[0]||'?').toUpperCase())}</span><span class="nm"><b>${esc(nm)}</b><small>${esc(sub)}</small></span>${pips}${act}${kb}</div>`}).join('');
  if(html!==seatsHtml){seatsHtml=html;$('seats').innerHTML=html}
  const st=$('st'),mine=S.phase=='roll'&&S.turn==me;
  if(lobby)st.textContent=isHost?(n<2?'Esperando a tus amigos…':'¡Todo listo! Empieza cuando quieras'):'Esperando que el anfitrión empiece…';
  else if(S.phase=='over')st.textContent='🏆 ¡Ganó '+S.seats[S.win]+'!';
  else st.textContent=S.turn==me?'¡Es tu turno!':'Turno de '+S.seats[S.turn];
  st.style.color=lobby||S.phase=='over'?'':COL[S.turn];
  if(!rolling)face(lobby?0:shown);
  $('msg').textContent=rolling?'🎲 …':canPick()?'Toca la ficha que quieres mover.':mine?'👆 Toca el dado para tirar':S.msg;
  $('roll').disabled=!mine||rolling;$('roll').hidden=lobby;
  /* el dado vive dentro del tablero, en la casa del jugador con el turno */
  const dc=$('dice'),[bo,bq]=BO[S.turn];
  dc.style.left=(bq+3)/15*100+'%';dc.style.top=(bo+3)/15*100+'%';dc.style.borderColor=COL[S.turn];
  dc.style.display=(lobby||S.phase=='over')?'none':'grid';dc.classList.toggle('ready',mine&&!rolling);
  $('start').hidden=!(isHost&&lobby);$('start').disabled=n<2;
  $('again').hidden=!(isHost&&S.phase=='over');
  const opp=[0,1,2,3].filter(c=>S.seats[c]&&c!=me);if(!opp.includes(tgt))tgt=opp.length?opp[0]:-1;
  if(!$('sheet').hidden&&sheetKind!='rules')drawSheet();
  callAll();
}
const rollAction=()=>{if(!(S.phase=='roll'&&S.turn==me)||rolling)return;isHost?doRoll(me,true):conn.send({t:'roll'})};
$('create').onclick=()=>{myName=$('name').value.trim()||'Anfitrión';saveName();err('');host()};

$('roll').onclick=rollAction;$('dice').onclick=rollAction;
$('start').onclick=startGame;$('again').onclick=startGame;
$('seats').onclick=e=>{const b=e.target.closest('button');if(!b)return;

face(0);tools();
try{$('name').value=localStorage.getItem('ludo_name')||''}catch(x){}
